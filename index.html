<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gastos médicos</title>
<!--STANDALONE:START-->
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Gastos médicos y reembolsos Cigna de la familia, publicados desde el artifact de Claude.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cigna">

<!--STANDALONE:END-->
<style>
/* Concepto: la misma vista del artifact «Gastos Médicos Cigna», solo para mirar en el iPhone.
   Los datos llegan cifrados desde el artifact (datos/cigna.enc.json) y se abren con el código CIGNA1. */
/*DS:TOKENS:START*/
/* ── Domésticas · sistema de diseño común (v1) ──────────────────────────────
   Paleta: #2950F4 · #4D78F3 · #719DF6 · #99C2F8 · #BDEBFB, con el azul marino #182D4A de fondo oscuro.
   Estilo iOS 27: tipografía del sistema (SF Pro), tarjetas blancas sobre fondo agrupado,
   barras y botones de vidrio, cápsulas, esquinas amplias. Igual en todas las apps de la casa. */
:root {
  --ds-b1: #2950F4; --ds-b2: #4D78F3; --ds-b3: #719DF6; --ds-b4: #99C2F8; --ds-b5: #BDEBFB; --ds-navy: #182D4A;
  --ds-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", system-ui, "Helvetica Neue", Arial, sans-serif;
  --ds-font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", system-ui, "Helvetica Neue", Arial, sans-serif;
  --ds-font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --ds-font-mono: ui-monospace, "SF Mono", Menlo, monospace;
  --ds-r-card: 24px; --ds-r-inner: 16px; --ds-r-field: 14px; --ds-r-sheet: 34px; --ds-r-pill: 999px;

  --ds-bg: #EFF3FB;
  --ds-bg-top: #DFE9FD;
  --ds-surface: #FFFFFF;
  --ds-surface-2: #F3F6FD;
  --ds-fill: rgba(41, 80, 244, 0.07);
  --ds-fill-2: rgba(41, 80, 244, 0.13);
  --ds-ink: #0E1B33;
  --ds-ink-2: #55617A;
  --ds-ink-3: #8691A8;
  --ds-line: rgba(24, 45, 74, 0.12);
  --ds-line-2: rgba(24, 45, 74, 0.2);
  --ds-tint: #2950F4;
  --ds-tint-soft: #E5ECFE;
  --ds-btn: #2950F4;
  --ds-on-btn: #FFFFFF;
  --ds-pos: #157A43; --ds-pos-soft: #DDF4E6;
  --ds-neg: #D1281C; --ds-neg-soft: #FDE8E6;
  --ds-warn: #A35500; --ds-warn-soft: #FFF0D9;
  --ds-hero: radial-gradient(120% 90% at 100% 0%, rgba(189, 235, 251, 0.45) 0%, rgba(189, 235, 251, 0) 55%), linear-gradient(150deg, #4D78F3 0%, #2950F4 58%, #2141D6 100%);
  --ds-hero-ink: #FFFFFF;
  --ds-hero-ink-2: rgba(255, 255, 255, 0.84);
  --ds-hero-line: rgba(255, 255, 255, 0.28);
  --ds-hero-glass: rgba(255, 255, 255, 0.18);
  --ds-glass: rgba(255, 255, 255, 0.7);
  --ds-glass-strong: rgba(255, 255, 255, 0.86);
  --ds-glass-line: rgba(255, 255, 255, 0.85);
  --ds-glass-edge: rgba(14, 27, 51, 0.1);
  --ds-glass-blur: blur(22px) saturate(1.8);
  --ds-shadow-1: 0 1px 2px rgba(24, 45, 74, 0.05), 0 4px 14px rgba(24, 45, 74, 0.05);
  --ds-shadow-2: 0 12px 32px rgba(24, 45, 74, 0.16), 0 2px 8px rgba(24, 45, 74, 0.08);
  --ds-shadow-btn: inset 0 1px 0 rgba(255, 255, 255, 0.32), 0 6px 16px rgba(41, 80, 244, 0.26);
  --ds-scrim: rgba(14, 27, 51, 0.36);
  --ds-chart-1: #2950F4; --ds-chart-2: #719DF6; --ds-chart-3: #99C2F8; --ds-chart-4: #BDEBFB;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ds-bg: #0A1224;
    --ds-bg-top: #13244A;
    --ds-surface: #152340;
    --ds-surface-2: #1C2C4D;
    --ds-fill: rgba(113, 157, 246, 0.12);
    --ds-fill-2: rgba(113, 157, 246, 0.2);
    --ds-ink: #EEF3FF;
    --ds-ink-2: #A9B6D0;
    --ds-ink-3: #77859F;
    --ds-line: rgba(189, 235, 251, 0.11);
    --ds-line-2: rgba(189, 235, 251, 0.2);
    --ds-tint: #8EB0FA;
    --ds-tint-soft: rgba(113, 157, 246, 0.18);
    --ds-btn: #3A62F5;
    --ds-on-btn: #FFFFFF;
    --ds-pos: #5DD68E; --ds-pos-soft: rgba(93, 214, 142, 0.14);
    --ds-neg: #FF8A80; --ds-neg-soft: rgba(255, 138, 128, 0.14);
    --ds-warn: #FFB65C; --ds-warn-soft: rgba(255, 182, 92, 0.14);
    --ds-hero: radial-gradient(120% 90% at 100% 0%, rgba(189, 235, 251, 0.28) 0%, rgba(189, 235, 251, 0) 55%), linear-gradient(150deg, #3D68F2 0%, #2950F4 55%, #1C38C2 100%);
    --ds-glass: rgba(24, 40, 70, 0.62);
    --ds-glass-strong: rgba(24, 40, 70, 0.84);
    --ds-glass-line: rgba(255, 255, 255, 0.14);
    --ds-glass-edge: rgba(0, 0, 0, 0.4);
    --ds-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
    --ds-shadow-2: 0 14px 36px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.3);
    --ds-shadow-btn: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 6px 16px rgba(0, 0, 0, 0.35);
    --ds-scrim: rgba(0, 0, 0, 0.55);
    --ds-chart-1: #719DF6; --ds-chart-2: #4D78F3; --ds-chart-3: #99C2F8; --ds-chart-4: #BDEBFB;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ds-bg: #0A1224;
  --ds-bg-top: #13244A;
  --ds-surface: #152340;
  --ds-surface-2: #1C2C4D;
  --ds-fill: rgba(113, 157, 246, 0.12);
  --ds-fill-2: rgba(113, 157, 246, 0.2);
  --ds-ink: #EEF3FF;
  --ds-ink-2: #A9B6D0;
  --ds-ink-3: #77859F;
  --ds-line: rgba(189, 235, 251, 0.11);
  --ds-line-2: rgba(189, 235, 251, 0.2);
  --ds-tint: #8EB0FA;
  --ds-tint-soft: rgba(113, 157, 246, 0.18);
  --ds-btn: #3A62F5;
  --ds-on-btn: #FFFFFF;
  --ds-pos: #5DD68E; --ds-pos-soft: rgba(93, 214, 142, 0.14);
  --ds-neg: #FF8A80; --ds-neg-soft: rgba(255, 138, 128, 0.14);
  --ds-warn: #FFB65C; --ds-warn-soft: rgba(255, 182, 92, 0.14);
  --ds-hero: radial-gradient(120% 90% at 100% 0%, rgba(189, 235, 251, 0.28) 0%, rgba(189, 235, 251, 0) 55%), linear-gradient(150deg, #3D68F2 0%, #2950F4 55%, #1C38C2 100%);
  --ds-glass: rgba(24, 40, 70, 0.62);
  --ds-glass-strong: rgba(24, 40, 70, 0.84);
  --ds-glass-line: rgba(255, 255, 255, 0.14);
  --ds-glass-edge: rgba(0, 0, 0, 0.4);
  --ds-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
  --ds-shadow-2: 0 14px 36px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.3);
  --ds-shadow-btn: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 6px 16px rgba(0, 0, 0, 0.35);
  --ds-scrim: rgba(0, 0, 0, 0.55);
  --ds-chart-1: #719DF6; --ds-chart-2: #4D78F3; --ds-chart-3: #99C2F8; --ds-chart-4: #BDEBFB;
  color-scheme: dark;
}
html { background: var(--ds-bg); }
body {
  font-family: var(--ds-font);
  background: linear-gradient(180deg, var(--ds-bg-top) 0, var(--ds-bg) 340px) no-repeat, var(--ds-bg);
  color: var(--ds-ink);
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.012em;
}
/* ── fin de los tokens comunes ── */

:root{
  --bg:var(--ds-bg); --surface:var(--ds-surface); --surface-2:var(--ds-surface-2); --ink:var(--ds-ink); --ink-2:var(--ds-ink-2); --muted:var(--ds-ink-2); --line:var(--ds-line-2);
  --accent:var(--ds-b1); --accent-ink:#FFFFFF; --accent-soft:var(--ds-tint-soft);
  --pend:var(--ds-warn); --pend-bg:var(--ds-warn-soft); --pend-line:#F1C98C;
  --env:var(--ds-tint); --env-bg:var(--ds-tint-soft);
  --pag:var(--ds-pos); --pag-bg:var(--ds-pos-soft);
  --bad:var(--ds-neg); --bad-bg:var(--ds-neg-soft);
  --p-L:#2950F4; --p-J:#0EA5B7; --p-E:#6D5AE6; --p-P:#1E3A8A; --p-F:var(--ds-ink-3);
  --grid:rgba(24,45,74,.08); --axis:rgba(24,45,74,.2); --bar:rgba(239,243,251,.78); --scrim:var(--ds-scrim);
  --font-display:var(--ds-font-display); --font-body:var(--ds-font);
  --r:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --accent:#8EB0FA; --accent-ink:#0A1224; --pend-line:rgba(255,182,92,.35);
    --p-L:#719DF6; --p-J:#2CC7D6; --p-E:#9C8CF5; --p-P:#A9BEE6;
    --grid:rgba(189,235,251,.08); --axis:rgba(189,235,251,.18); --bar:rgba(21,35,64,.78);
  }
}
:root[data-theme="dark"]{
    --accent:#8EB0FA; --accent-ink:#0A1224; --pend-line:rgba(255,182,92,.35);
    --p-L:#719DF6; --p-J:#2CC7D6; --p-E:#9C8CF5; --p-P:#A9BEE6;
    --grid:rgba(189,235,251,.08); --axis:rgba(189,235,251,.18); --bar:rgba(21,35,64,.78);
}
/*DS:TOKENS:END*/
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px calc(120px + env(safe-area-inset-bottom,0px))}
@media (min-width:920px){.app{max-width:1060px}}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;font-weight:650}
h1{font-family:var(--font-display);font-weight:700;font-size:34px;letter-spacing:-.025em;line-height:1.05;margin:0;text-wrap:balance}
.lead{color:var(--ink-2);margin:-6px 0 16px;max-width:60ch}

.stack{display:grid;gap:14px;align-content:start;min-width:0}
.grid2{display:grid;gap:14px;align-items:start}
@media (min-width:920px){.grid2{grid-template-columns:1fr 1fr}}
.grid-p{display:grid;gap:14px}
@media (min-width:640px){.grid-p{grid-template-columns:1fr 1fr}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
.hint{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;font-size:14px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.tile .lbl{font-size:12px;color:var(--muted);font-weight:650;letter-spacing:.04em;text-transform:uppercase}
.tile .big{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1.1;overflow-wrap:anywhere}
.tile .sub{font-size:13px;color:var(--ink-2)}
.cur{font-size:.5em;font-weight:650;color:var(--ink-2);margin-right:5px;letter-spacing:0;vertical-align:.18em}
@media (max-width:380px){.tile .big{font-size:22px}}
button.tile:hover{border-color:var(--accent)}

/* boletas por enviar: el borde punteado imita el corte de una boleta */
.pend-card{background:var(--pend-bg);border-color:var(--pend-line)}
.pend-card .card-h h2{color:var(--pend)}
.big-row{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.big-row .big{font-family:var(--font-display);font-weight:700;font-size:36px;letter-spacing:-.025em;line-height:1}
.big-row .sub{color:var(--ink-2);font-size:14px}
.perf{border-top:2px dashed var(--pend-line);margin:12px -16px;}
.mini{list-style:none;margin:0;padding:0;display:grid}
.mrow{display:grid;grid-template-columns:10px 1fr auto auto;align-items:center;gap:10px;width:100%;background:none;border:0;padding:8px 0;text-align:left;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.mini li:last-child .mrow{border-bottom:0}
.mrow .m-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .m-d{color:var(--muted);font-size:13px}
.mrow .m-a{font-variant-numeric:tabular-nums;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--pc)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions p{margin:0;flex:1 1 100%;font-weight:600}

.ok-card{display:flex;gap:12px;align-items:center}
.ok-card h3{margin:0 0 2px;font-size:16px}
.ok-card p{margin:0}
.ico-ok{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--pag-bg);color:var(--pag)}

.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:650;font-size:15px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.quiet{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--pend);color:var(--surface)}
.btn.danger{background:none;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.danger[data-armed]{background:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.5}
.btn-add{width:100%;margin-top:10px}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px 2px 6px;font-size:12px;font-weight:650;white-space:nowrap}
.pill svg{width:13px;height:13px}
.pill.pend{background:var(--pend-bg);color:var(--pend)}
.pend-card .pill.pend{background:var(--surface)}
.pill.env{background:var(--env-bg);color:var(--env)}
.pill.pag{background:var(--pag-bg);color:var(--pag)}

/* topes de copago */
.meters{display:grid;gap:14px}
.meter .m-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.meter .m-n{font-weight:650}
.meter .m-v{font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink-2)}
.meter .m-v b{color:var(--ink);font-weight:700}
.track{position:relative;height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.track .fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--pc)}
.meter .m-sub{font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.meter.fam{padding-top:14px;border-top:1px solid var(--line)}
.meter.fam .track{height:14px}
.full-tag{color:var(--pag);font-weight:700}

/* gráfico */
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:-4px 0 8px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.chart{position:relative;min-height:220px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.tip{position:absolute;top:0;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.14);min-width:150px;z-index:2}
.tip b{display:block;margin-bottom:2px}
.tip .tl{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.tip .tl span:first-child{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.tip .tt{border-top:1px solid var(--line);margin-top:4px;padding-top:4px;font-weight:700}

.esp{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.esp li{display:grid;grid-template-columns:minmax(84px,30%) 1fr auto;gap:10px;align-items:center;font-size:14px}
.esp .e-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.esp .e-b{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.esp .e-b span{display:block;height:100%;background:var(--accent);border-radius:4px}
.esp .e-v{font-variant-numeric:tabular-nums;text-align:right}
.esp .e-v small{display:block;color:var(--muted);font-size:11px}

/* lista de gastos */
.filters{display:grid;gap:10px;margin-bottom:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;padding:11px 0;outline:0;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{font-size:13px;color:var(--muted);margin:4px 2px 10px}
.grp{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 6px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.grp .num{letter-spacing:0;text-transform:none}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;width:100%;background:none;border:0;padding:11px 14px;text-align:left}
.list li+li .row{border-top:1px solid var(--line)}
.row:hover{background:var(--surface-2)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;background:var(--pc)}
.row .t{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .main{min-width:0}
.row .amt{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.row .clp{font-variant-numeric:tabular-nums;font-weight:650}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty h3{color:var(--ink);margin:0 0 4px;font-size:17px}

/* copagos */
.pc-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pc-h .av{width:32px;height:32px;font-size:13px}
.pc-h h3{margin:0;font-size:17px;flex:1}
.pc-h .sal{text-align:right;font-variant-numeric:tabular-nums}
.pc-h .sal b{display:block;font-family:var(--font-display);font-size:20px;letter-spacing:-.01em}
.pc-h .sal small{color:var(--muted);font-size:12px}
.amts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

/*DS:LAYER:START*/
/* ── Domésticas · base común (v1) ── */
html { background: var(--ds-bg); }
body {
  font-family: var(--ds-font);
  background: linear-gradient(180deg, var(--ds-bg-top) 0, var(--ds-bg) 360px) no-repeat, var(--ds-bg);
  color: var(--ds-ink);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, h4 { font-family: var(--ds-font-display); letter-spacing: -0.022em; }
button, input, select, textarea { font-family: inherit; }
::selection { background: var(--ds-tint-soft); }
:focus-visible { outline-color: var(--ds-tint); }
input, select, textarea { accent-color: var(--ds-btn); caret-color: var(--ds-tint); }
@keyframes ds-rise { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
.mark.app-icon, img.app-icon { display: block; overflow: hidden; padding: 0; background: none; object-fit: cover; border-radius: 23%; box-shadow: 0 0 0 0.5px rgba(14, 27, 51, 0.08), 0 4px 12px rgba(41, 80, 244, 0.25); }
/* ── fin de la base común ── */

/* Domésticas · componentes (Gastos médicos) */
.eyebrow,.card-h h2,.tile .lbl{font-size:13px;letter-spacing:-.005em;text-transform:none;font-weight:600;color:var(--ds-ink-2)}
h1{font-weight:700;letter-spacing:-.03em}
.top-t{display:flex;align-items:center;gap:12px;min-width:0}
.top-t .mark{width:46px;height:46px;flex:none}
.card,.tile,.list{border:0;border-radius:22px;box-shadow:var(--ds-shadow-1)}
.pend-card{border:0;box-shadow:none}
.tile .big,.big-row .big,.hero-n,.pc-h .sal b{font-family:var(--ds-font-round);letter-spacing:-.025em}
button.tile:hover{border-color:transparent;box-shadow:var(--ds-shadow-1),0 0 0 2px var(--ds-tint-soft)}
.list li+li .row{border-top:.5px solid var(--ds-line-2)}
.grp{font-size:13px;letter-spacing:-.005em;text-transform:none;font-weight:600;color:var(--ds-ink-2)}
.btn{border-radius:999px;min-height:44px;padding:0 18px;font-weight:600;transition:transform .16s ease,opacity .16s ease}
.btn:active{transform:scale(.97);opacity:.88}
.btn.primary{background:var(--ds-btn);color:#fff;box-shadow:var(--ds-shadow-btn)}
.btn.quiet{background:var(--ds-fill);color:var(--ds-tint);border:0}
.btn.danger{border:0;background:var(--ds-neg-soft)}
.chip{border:0;background:var(--ds-fill);color:var(--ds-ink);min-height:36px;padding:0 14px}
.chip[aria-pressed="true"]{background:var(--ds-btn);color:#fff}
.search{border:1.5px solid transparent;border-radius:14px;box-shadow:var(--ds-shadow-1)}
.search:focus-within{border-color:var(--ds-tint)}
.track{border:0;background:var(--ds-fill-2)}
.amt-chip{border:0;background:var(--ds-fill);border-radius:999px;padding:5px 10px}
.esp .e-b{background:var(--ds-fill-2)}

<script>
(function(){
'use strict';
/* Gastos médicos · app del iPhone (solo lectura).
   Muestra lo que publica el artifact «Gastos Médicos Cigna» de Claude. Los datos llegan cifrados
   (AES-256-GCM) en datos/cigna.enc.json y se abren con la clave del código CIGNA1, que queda solo
   en este dispositivo. Los cálculos son los mismos del artifact. */
const PERS=[{k:'L',n:'Lorena'},{k:'J',n:'Josefina'},{k:'E',n:'Emilia'},{k:'P',n:'Pablo'}];
const PN={L:'Lorena',J:'Josefina',E:'Emilia',P:'Pablo',F:'Familia'};
const TIPOS={c:'Consulta',r:'Remedios',e:'Examen',d:'Dental'};
const EST={0:{n:'Por enviar',c:'pend'},1:{n:'Enviado',c:'env'},2:{n:'Pagado',c:'pag'}};
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DEF={topePersona:600,topeFamilia:1800,cobertura:0.8,saldoInicial:0};
const LS_CLAVE='cigna-clave',LS_DATOS='cigna-datos',LS_UI='cigna-ui';
const URL_DATOS='datos/cigna.enc.json';
const IC={
  pend:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>',
  env:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h12M13 7l5 5-5 5"/></svg>',
  pag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  clip:'<svg class="clip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Con boleta adjunta"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg>',
  rf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>'
};

const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
let ui={};try{ui=JSON.parse(ls.get(LS_UI)||'{}')||{}}catch(e){ui={}}
const S={clave:ls.get(LS_CLAVE),state:'cargando',err:'',offline:false,cargando:false,leido:0,at:null,
  gastos:[],copagos:[],egresos:[],tc:[],liqs:[],cfg:{...DEF},
  anio:new Date().getFullYear(),tab:['resumen','gastos','copagos','banco'].includes(ui.tab)?ui.tab:'resumen',f:{p:'all',s:'all',q:''},_anioSet:false};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>{s=String(s||'');return s.charAt(0).toUpperCase()+s.slice(1)};
const nf0=new Intl.NumberFormat('es-CL',{maximumFractionDigits:0});
const nf2=new Intl.NumberFormat('es-CL',{minimumFractionDigits:2,maximumFractionDigits:2});
const fCLP=n=>(n==null||isNaN(n))?'—':(n<0?'−':'')+'$'+nf0.format(Math.abs(Math.round(n)));
const fUSD=n=>(n==null||isNaN(n))?'—':(n<0?'−':'')+'US$ '+nf2.format(Math.abs(n));
const fUSD0=n=>'US$ '+nf0.format(Math.round(n));
const hUSD=n=>(n==null||isNaN(n))?'—':`<span class="cur">${n<0?'−':''}US$</span>${nf2.format(Math.abs(n))}`;
const num=v=>{const x=+v;return isFinite(x)?x:0};
function todayISO(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function fD(s){if(!s)return '';const p=s.split('-').map(Number);return p[2]+' '+MES[p[1]-1]+(p[0]!==S.anio?' '+p[0]:'')}
function fM(ym){const p=ym.split('-').map(Number);return MESL[p[1]-1]+(p[0]!==S.anio?' '+p[0]:'')}
function fCuando(iso){
  if(!iso)return '';const d=new Date(iso);if(isNaN(d))return '';const n=new Date();const p=x=>(x<10?'0':'')+x;
  const ay=new Date(n.getFullYear(),n.getMonth(),n.getDate()-1);
  const dia=d.toDateString()===n.toDateString()?'hoy':d.toDateString()===ay.toDateString()?'ayer':d.getDate()+' '+MES[d.getMonth()]+(d.getFullYear()!==n.getFullYear()?' '+d.getFullYear():'');
  return dia+', '+p(d.getHours())+':'+p(d.getMinutes());
}
const byFechaDesc=(a,b)=>(b.fecha||'').localeCompare(a.fecha||'')||String(b.creado||b.id).localeCompare(String(a.creado||a.id));

/* ---------- descifrado ---------- */
function b64aBytes(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
function claveDeCodigo(texto){
  const m=/(?:CIGNA1\.)?([A-Za-z0-9_-]{43})(?![A-Za-z0-9_-])/.exec(String(texto||'').trim());
  if(!m)return null;
  try{const b=b64aBytes(m[1].replace(/-/g,'+').replace(/_/g,'/')+'=');return b.length===32?m[1]:null}catch(e){return null}
}
async function descifrar(enc,clave){
  if(!enc||enc.alg!=='AES-256-GCM'||!enc.iv||!enc.data)throw {code:'formato'};
  const raw=b64aBytes(clave.replace(/-/g,'+').replace(/_/g,'/')+'=');
  const key=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);
  let buf;
  try{buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64aBytes(enc.iv)},key,b64aBytes(enc.data))}
  catch(e){throw {code:'clave'}}
  return JSON.parse(new TextDecoder().decode(buf));
}
function aplicar(d){
  S.gastos=Array.isArray(d.gastos)?d.gastos:[];S.copagos=Array.isArray(d.copagos)?d.copagos:[];
  S.egresos=Array.isArray(d.egresos)?d.egresos:[];S.tc=Array.isArray(d.tc)?d.tc:[];S.liqs=Array.isArray(d.liqs)?d.liqs:[];
  S.cfg={...DEF,...(d.cfg||{})};S.at=d.at||null;
  if(!S._anioSet){S._anioSet=true;const ys=years().filter(y=>S.gastos.some(g=>+String(g.fecha).slice(0,4)===y));if(ys.length&&!ys.includes(S.anio))S.anio=ys[ys.length-1]}
}
async function cargar(){
  if(!S.clave){S.state='setup';render();return}
  if(S.cargando)return;S.cargando=true;paintUpd();
  let enc=null,red=false;
  try{
    const r=await fetch(URL_DATOS+'?t='+Date.now(),{cache:'no-store'});
    if(r.status===404){S.cargando=false;S.state=S.gastos.length?'ok':'sin-datos';render();return}
    if(!r.ok)throw new Error(String(r.status));
    enc=await r.json();red=true;
  }catch(e){try{enc=JSON.parse(ls.get(LS_DATOS)||'null')}catch(_){enc=null}}
  if(!enc){S.cargando=false;S.offline=true;S.state=S.gastos.length?'ok':'sin-conexion';render();return}
  try{
    const d=await descifrar(enc,S.clave);aplicar(d);S.state='ok';S.offline=!red;S.leido=Date.now();
    if(red)ls.set(LS_DATOS,JSON.stringify(enc));
  }catch(e){
    if(e&&e.code==='clave'){S.state='setup';S.err='Ese código no abre los datos publicados. Cópialo de nuevo desde el artifact.'}
    else{S.state=S.gastos.length?'ok':'sin-conexion';S.offline=true}
  }
  S.cargando=false;render();
}

/* ---------- cálculos (iguales al artifact) ---------- */
const gy=()=>S.gastos.filter(g=>g.fecha&&+g.fecha.slice(0,4)===S.anio);
function tcList(){return S.tc.filter(t=>num(t.valor)>0&&t.fecha).sort((a,b)=>a.fecha.localeCompare(b.fecha))}
function tcAt(f){const t=tcList();if(!t.length)return null;let v=t[0].valor;for(const x of t){if(x.fecha<=f)v=x.valor;else break}return num(v)}
function tcNow(){const t=tcList();return t.length?t[t.length-1]:null}
function tasa(k){
  const xs=S.gastos.filter(g=>g.persona===k&&g.estado===2&&num(g.reemb)>0&&num(g.clp)>0).sort(byFechaDesc).slice(0,6)
    .map(g=>{const tc=tcAt(g.fecha);return tc?g.reemb/(g.clp/tc):null}).filter(x=>x!=null).sort((a,b)=>a-b);
  if(!xs.length)return num(S.cfg.cobertura)||0.8;
  const m=xs.length>>1;const med=xs.length%2?xs[m]:(xs[m-1]+xs[m])/2;
  return Math.min(1,Math.max(0,med));
}
function estim(g){const t=tcNow();if(!t||!num(g.clp))return null;return g.clp/num(t.valor)*tasa(g.persona)}
const sumEst=list=>list.reduce((a,g)=>a+(estim(g)||0),0);
const copY=()=>S.copagos.filter(c=>num(c.anio)===S.anio);
const copagoDe=k=>copY().filter(c=>c.persona===k).reduce((a,c)=>a+num(c.monto),0);
const copagoFam=()=>copY().reduce((a,c)=>a+num(c.monto),0);
function bankRows(){
  const ing={},eg={};
  for(const g of S.gastos){if(num(g.reemb)&&g.fecha){const m=g.fecha.slice(0,7);ing[m]=(ing[m]||0)+num(g.reemb)}}
  for(const e of S.egresos){if(e.mes)eg[e.mes]=(eg[e.mes]||0)+num(e.monto)}
  const keys=[...Object.keys(ing),...Object.keys(eg)].sort();
  const now=todayISO().slice(0,7);
  const start=keys.length?keys[0]:now;
  const end=[keys.length?keys[keys.length-1]:now,now,S.anio+'-12'].sort().pop();
  let [y,m]=start.split('-').map(Number);const rows=[];let saldo=num(S.cfg.saldoInicial);
  for(let guard=0;guard<600;guard++){
    const k=y+'-'+String(m).padStart(2,'0');const i=ing[k]||0,e=eg[k]||0;saldo+=i-e;
    rows.push({mes:k,ing:i,eg:e,saldo,future:k>now});
    if(k>=end)break;m++;if(m>12){m=1;y++}
  }
  return rows;
}
function saldoBanco(){const r=bankRows().filter(x=>!x.future);return r.length?r[r.length-1].saldo:num(S.cfg.saldoInicial)}
function years(){const ys=new Set(S.gastos.filter(g=>g.fecha).map(g=>+g.fecha.slice(0,4)));ys.add(new Date().getFullYear());return [...ys].sort((a,b)=>a-b)}

/* ---------- piezas ---------- */
const pc=k=>`--pc:var(--p-${k in PN?k:'F'})`;
function pill(g){
  if(g.estado===2)return `<span class="pill pag">${IC.pag}${g.reemb!=null?fUSD(num(g.reemb)):'Pagado'}</span>`;
  const e=EST[g.estado]||EST[0];return `<span class="pill ${e.c}">${IC[e.c]}${e.n}</span>`;
}
function yearSel(){
  const ys=years();if(ys.length<2)return '';
  return `<div class="chips" role="group" aria-label="Año">${ys.map(y=>`<button class="chip" data-act="year" data-y="${y}" aria-pressed="${y===S.anio}">${y}</button>`).join('')}</div>`;
}
const ready=()=>S.state==='ok';
function updHtml(){
  if(!S.at&&!S.cargando)return '';
  const t=S.at?`Publicado ${esc(fCuando(S.at))}`:'Actualizando…';
  return `${S.offline?'Sin conexión · ':''}${t}<button class="rf${S.cargando?' spin':''}" data-act="refresh" aria-label="Actualizar">${IC.rf}</button>`;
}
function paintUpd(){
  const b=$('#upd-bar');if(b){b.innerHTML=updHtml();b.classList.toggle('off',!!S.offline);b.hidden=!ready()}
  const t=$('#upd-top');if(t){t.innerHTML=updHtml();t.classList.toggle('off',!!S.offline)}
  document.querySelectorAll('.rf').forEach(r=>r.classList.toggle('spin',!!S.cargando));
}
function stateCard(){
  if(S.state==='sin-datos')return `<div class="card empty"><h3>Aún no hay datos publicados</h3><p>Abre el artifact en Claude, ve a Banco → App del iPhone y toca «Publicar ahora».</p></div>`;
  if(S.state==='sin-conexion')return `<div class="card empty"><h3>Sin conexión</h3><p>No se pudieron leer los datos. Revisa la conexión y vuelve a intentarlo.</p><button class="btn quiet" data-act="refresh" style="margin-top:10px">Reintentar</button></div>`;
  return `<div class="card" aria-busy="true"><p class="muted" style="margin:0 0 6px">Cargando tus gastos…</p><div class="skel" style="width:70%"></div><div class="skel" style="width:45%"></div><div class="skel" style="width:60%"></div></div>`;
}
function meter(name,used,tope,color){
  const left=tope-used;const pct=Math.max(0,Math.min(100,used/tope*100));
  return `<div class="meter"><div class="m-top"><span class="m-n">${esc(name)}</span><span class="m-v">${left<=0?'<span class="full-tag">Tope alcanzado</span>':`Saldo <b>${fUSD(left)}</b>`}</span></div>
  <div class="track" role="img" aria-label="${esc(name)}: copago ${fUSD(used)} de ${fUSD0(tope)}"><span class="fill" style="width:${pct}%;--pc:${color}"></span></div>
  <div class="m-sub">Copago ${fUSD(used)} de ${fUSD0(tope)}</div></div>`;

function pie(){return `<p class="foot">Solo lectura: los cambios se hacen en el artifact de Claude. <button data-act="desconectar">Quitar el código</button></p>`}
function espCard(G){
  const by={};
  for(const g of G){const k=String(g.detalle||'sin detalle').toLowerCase();(by[k]=by[k]||{clp:0,n:0});by[k].clp+=num(g.clp);by[k].n++}

  <ul class="esp">${top.map(([k,v])=>`<li><span class="e-n">${esc(cap(k))}</span><span class="e-b"><span style="width:${Math.max(2,v.clp/max*100)}%"></span></span><span class="e-v">${fCLP(v.clp)}<small>${v.n} ${v.n===1?'boleta':'boletas'}</small></span></li>`).join('')}</ul></section>`;
}
function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw||1)));const n=raw/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function fCompact(v){if(v>=1e6)return '$'+(v/1e6).toLocaleString('es-CL',{maximumFractionDigits:1})+' M';if(v>=1000)return '$'+Math.round(v/1000)+' mil';return '$'+v}
function drawChart(){
  const el=$('#chart-mes');if(!el)return;
  const W=Math.max(260,Math.round(el.clientWidth||600)),H=isDesk()?Math.max(140,Math.floor(el.clientHeight)-4):230,m={t:10,r:4,b:26,l:56};
  const iw=W-m.l-m.r,ih=H-m.t-m.b;
  const G=gy();const data=MES.map(()=>({L:0,J:0,E:0,P:0}));
  for(const g of G){const i=+g.fecha.slice(5,7)-1;if(data[i]&&g.persona in data[i])data[i][g.persona]+=num(g.clp)}
  const tot=data.map(d=>d.L+d.J+d.E+d.P);
  const maxV=Math.max(...tot,1);const step=niceStep(maxV/4);const top=Math.ceil(maxV/step)*step;
  const y=v=>m.t+ih-(v/top)*ih;const col=iw/12;const bw=Math.min(28,col*0.62);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Gasto mensual por persona en pesos">`;
  for(let v=0;v<=top+1e-6;v+=step){const yy=y(v);s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}" stroke="${v===0?'var(--axis)':'var(--grid)'}" stroke-width="1"/>`;s+=`<text x="${m.l-8}" y="${yy+4}" text-anchor="end">${fCompact(v)}</text>`}
  const short=W<430;
  data.forEach((d,i)=>{
    const x=m.l+i*col+(col-bw)/2;let base=y(0);
    const segs=PERS.map(p=>({k:p.k,v:d[p.k]})).filter(z=>z.v>0);
    segs.forEach((z,j)=>{
      const h=(z.v/top)*ih;const isTop=j===segs.length-1;const gap=isTop?0:2;
      const yt=base-h;const hh=Math.max(0,h-gap);const yb=yt+hh;
      if(isTop){const r=Math.min(4,hh/2,bw/2);s+=`<path d="M${x},${yb} V${yt+r} Q${x},${yt} ${x+r},${yt} H${x+bw-r} Q${x+bw},${yt} ${x+bw},${yt+r} V${yb} Z" fill="var(--p-${z.k})"/>`}
      else s+=`<rect x="${x}" y="${yt+gap}" width="${bw}" height="${hh}" fill="var(--p-${z.k})"/>`;
      base=yt;
    });
    s+=`<text x="${m.l+i*col+col/2}" y="${H-8}" text-anchor="middle">${short?MES[i].charAt(0).toUpperCase():MES[i]}</text>`;
    s+=`<rect class="hit" data-i="${i}" x="${m.l+i*col}" y="${m.t}" width="${col}" height="${ih}" fill="transparent"/>`;
  });
  s+='</svg><div class="tip" id="tip" hidden></div>';
  el.innerHTML=s;
  const tip=el.querySelector('#tip');const svg=el.querySelector('svg');
  const show=e=>{const t=e.target.closest('.hit');if(!t)return;const i=+t.dataset.i;const d=data[i];
    tip.innerHTML=`<b>${MESL[i]} ${S.anio}</b>${PERS.filter(p=>d[p.k]>0).map(p=>`<div class="tl"><span><i class="dot" style="${pc(p.k)}"></i>${p.n}</span><span>${fCLP(d[p.k])}</span></div>`).join('')||'<div class="tl"><span>Sin gastos</span></div>'}<div class="tl tt"><span>Total</span><span>${fCLP(tot[i])}</span></div>`;
    tip.hidden=false;const cx=m.l+i*col+col/2;const tw=tip.offsetWidth;let left=cx-tw/2;left=Math.max(0,Math.min(W-tw,left));tip.style.left=left+'px';tip.style.top=Math.max(0,Math.min(y(tot[i])-tip.offsetHeight-8,ih-tip.offsetHeight))+'px'};
  svg.addEventListener('pointerover',show);svg.addEventListener('pointerdown',show);
  svg.addEventListener('pointerleave',()=>{tip.hidden=true});
}

  const tc=`<section class="card d-tc"><div class="card-h"><h2>Tipo de cambio</h2><span class="hint">Pesos por dólar</span></div>
    ${now?`<div class="lrow ro" style="border-bottom:0;padding-top:0;flex:none"><span><span class="hero-n num" style="font-size:32px;display:block">$${nf2.format(num(now.valor))}</span><small>Vigente desde el ${fD(now.fecha)}</small></span></div>`:'<p class="muted">Sin tipo de cambio.</p>'}
    <div class="grow" id="tc-list" style="border-top:1px solid var(--line)">${T.slice(1,isDesk()?19:7).map(t=>`<div class="lrow ro"><span>${fD(t.fecha)}</span><span class="v">${nf2.format(num(t.valor))}</span></div>`).join('')}</div></section>`;
  const LQ=S.liqs.slice().sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  const liq=`<section class="card d-liq"><div class="card-h"><h2>Liquidaciones Cigna</h2><span class="hint">US$ pagados</span></div>
    <div class="grow">${LQ.length?LQ.map(l=>`<div class="lrow ro"><span>Liquidación del ${fD(l.fecha)}<small>${esc(Object.entries(l.porPersona||{}).filter(([k,v])=>v>0).map(([k])=>PN[k]||k).join(', ')||'Sin pagos')} · ${num(l.boletas)} ${num(l.boletas)===1?'boleta':'boletas'}</small></span><span class="v">${fUSD(num(l.pagado!=null?l.pagado:l.calculado))}</span></div>`).join('')
      :'<p class="muted" style="margin:0">Las liquidaciones se leen en el artifact.</p>'}</div></section>`;
  return head+`<div class="bank">${hero}${liq}${tbl}${egr}${tc}</div>`;
}

/* ---------- render ---------- */
let raf=0;
function render(){cancelAnimationFrame(raf);raf=requestAnimationFrame(doRender)}
const isDesk=()=>window.matchMedia('(min-width:900px)').matches;
function fitText(sel,min=16){document.querySelectorAll(sel).forEach(el=>{el.style.fontSize='';let f=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>el.clientWidth+1&&f>min){f-=1;el.style.fontSize=f+'px'}})}
function fitList(el,min=1){if(!el)return;while(el.children.length>min&&el.scrollHeight>el.clientHeight+1)el.lastElementChild.remove()}
function doRender(){
  const setup=S.state==='setup';
  document.querySelector('.tabbar').hidden=setup;
  document.querySelectorAll('.view').forEach(v=>v.hidden=setup?v.id!=='v-setup':v.id!=='v-'+S.tab);
  document.querySelectorAll('.tabbar button').forEach(b=>{if(b.dataset.tab===S.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  $('#brand-year').textContent=S.anio;
  $('#yearbox').innerHTML=ready()?yearSel():'';
  if(setup){$('#v-setup').innerHTML=vSetup();paintUpd();return}
  const desk=isDesk();
  if(S.tab==='resumen'){
    $('#v-resumen').innerHTML=vResumen();
    if(desk&&ready()){
      const ul=$('#v-resumen .pend-card .mini');
      if(ul){fitList(ul);const more=$('#pend-more');if(more&&ul.children.length<+ul.dataset.total)more.textContent='Ver las '+ul.dataset.total}
      fitList($('#v-resumen .esp'));
    }
    fitText('#v-resumen .tile .big');
    drawChart();
  }
  else if(S.tab==='gastos')renderGastos();
  else if(S.tab==='copagos')$('#v-copagos').innerHTML=vCopagos();
  else if(S.tab==='banco'){$('#v-banco').innerHTML=vBanco();if(desk)fitList($('#tc-list'))}
  paintUpd();
}
function setTab(t){S.tab=t;ls.set(LS_UI,JSON.stringify({tab:t}));window.scrollTo(0,0);render()}
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.tab!=='gastos')render()},150)});
let tt;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true},2600)}

/* ---------- eventos ---------- */
let armado=false;
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='tab')setTab(b.dataset.tab);
  else if(a==='year'){S.anio=+b.dataset.y;render()}
  else if(a==='fp'){S.f.p=b.dataset.v;renderGastos()}
  else if(a==='fs'){S.f.s=b.dataset.v;renderGastos()}
  else if(a==='goto'){S.f={p:'all',s:b.dataset.s,q:''};$('#g-q').value='';setTab('gastos')}
  else if(a==='ver')verGasto(b.dataset.id);
  else if(a==='cerrar')$('#sheet').close();
  else if(a==='refresh')cargar().then(()=>{if(S.state==='ok'&&!S.offline)toast('Datos al día')});
  else if(a==='pegar'){
    const manual=()=>{const t=$('#cod');if(t)t.focus()};
    if(navigator.clipboard&&navigator.clipboard.readText)navigator.clipboard.readText().then(txt=>{if(claveDeCodigo(txt))conectar(txt);else{const t=$('#cod');if(t&&txt)t.value=txt;manual()}},manual);
    else manual();
  }
  else if(a==='conectar'){const t=$('#cod');conectar(t?t.value:'')}
  else if(a==='desconectar'){
    if(!armado){armado=true;b.textContent='Toca de nuevo para quitarlo';setTimeout(()=>{armado=false;if(b.isConnected)b.textContent='Quitar el código'},4000);return}
    armado=false;ls.del(LS_CLAVE);ls.del(LS_DATOS);S.clave=null;S.gastos=[];S.at=null;S.state='setup';render();
  }
});
$('#sheet').addEventListener('click',e=>{if(e.target===$('#sheet'))$('#sheet').close()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.clave&&Date.now()-S.leido>60000)cargar()});

/* ---------- arranque ---------- */
// Sin zoom con los dedos: Safari no siempre respeta user-scalable=no, así que se bloquean los gestos.
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
setupGastosControls();
if(S.clave){
  // Muestra de inmediato lo último que se leyó y luego busca la versión nueva
  try{const enc=JSON.parse(ls.get(LS_DATOS)||'null');if(enc)descifrar(enc,S.clave).then(d=>{if(S.state!=='ok'){aplicar(d);S.state='ok';S.offline=true;render()}}).catch(()=>{})}catch(e){}
}
render();cargar();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();

</script>
</body>
</html>
